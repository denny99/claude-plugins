name: Release
on:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # the ruleset "main: only Denny" lets deploy keys bypass it (GitHub Actions cannot bypass on a personal
          # repo); this is the only deploy key, and the release commit and tags go out over it
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.17'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
